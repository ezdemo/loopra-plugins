<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>上下文透镜</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div id="status" role="status" aria-live="polite" hidden></div>
    <section id="empty" class="empty">
      <div class="lens-mark" aria-hidden="true">◈</div>
      <h1>上下文窗口</h1>
      <p id="empty-text">正在读取请求快照…</p>
      <button id="empty-refresh" type="button">刷新</button>
    </section>
    <div id="overview" hidden>
      <div class="overview-body">
        <section class="metrics" aria-label="上下文用量">
          <div class="usage-metric">
            <div class="metric-label">已用上下文 <span id="health" class="health" hidden>健康</span></div>
            <div class="metric-value"><strong id="total">—</strong><span id="capacity">/ 未知窗口</span></div>
            <div id="usage-note" class="metric-note">文本估算</div>
            <div class="model-status"><span id="model" class="model"></span><span class="measurement"><i class="live-dot" aria-hidden="true"></i><span id="measurement-label">估算</span></span></div>
          </div>
          <div class="cache-metric">
            <div class="metric-label">提示词缓存</div>
            <div class="metric-value"><strong id="cache-rate">—</strong><span>命中</span></div>
            <div id="cache-bar" class="cache-bar" role="progressbar" aria-label="提示词缓存命中率"><span id="cache-fill"></span></div>
            <div id="cache-note" class="metric-note">暂无缓存数据</div>
          </div>
        </section>
        <section class="composition" aria-label="上下文组成">
          <div id="map" class="context-map grid" role="group" aria-label="上下文组成，每个非空文本分类至少显示一格，点击筛选" title="每个非空文本分类至少显示一格，实际用量见图例"></div>
          <div class="map-footer"><div id="legend" class="legend"></div></div>
        </section>
        <section class="blocks-section">
          <div class="block-toolbar"><span class="section-label">内容</span><div id="filters" class="filters" role="group" aria-label="内容分类"></div></div>
          <div id="blocks" class="blocks"></div><p id="no-results" class="no-results" hidden>没有匹配的上下文</p>
          <button id="show-all" class="text-button show-all" type="button" hidden></button>
        </section>
        <footer class="session-footer">
          <div class="session-heading"><div id="breadcrumb" class="breadcrumb"></div><span id="round-count"></span></div>
          <div class="trend-row"><span>本会话</span><svg id="trend" viewBox="0 0 1000 44" preserveAspectRatio="none" role="img" aria-label="近期请求上下文趋势"></svg><span id="request-count"></span></div>
        </footer>
      </div>
    </div>
    <section id="inspector" class="inspector" hidden>
      <header class="inspect-header"><button id="back" class="text-button" type="button">← 返回快照</button><span id="inspect-tokens"></span></header>
      <div class="inspect-heading"><span id="inspect-kind" class="kind-mark"></span><h2 id="inspect-title"></h2></div>
      <p id="inspect-source" class="source"></p>
      <p id="capture-note" class="source"></p>
      <select id="inspect-parts" aria-label="选择内容片段" hidden></select>
      <p id="inspect-note" class="inspect-note" hidden></p>
      <pre id="inspect-text" tabindex="0"></pre>
    </section>
  </main>
  <script src="_loopra/bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
